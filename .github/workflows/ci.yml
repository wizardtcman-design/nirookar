name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- وب‌سایت (Next.js) ----------
  web-quality:
    name: وب — بررسی کیفیت و ساخت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها
        run: bun install --frozen-lockfile

      - name: تولید کلاینت Prisma
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: بررسی TypeScript
        run: bunx tsc --noEmit

      - name: ساخت نسخه تولید
        run: bun run build

  # ---------- اپ موبایل (Expo / React Native) ----------
  mobile-quality:
    name: موبایل — بررسی TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        working-directory: apps/mobile
        run: npm ci

      - name: بررسی TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit

  mobile-apk:
    name: موبایل — ساخت APK اندروید
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: نصب وابستگی‌ها
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npm ci

      - name: Prebuild اندروید
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild -p android --no-install

      - name: ساخت APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: آماده‌سازی فایل APK با نام خوانا
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             dist/nirookar-mobile-build-${{ github.run_number }}.apk

      - name: بارگذاری Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nirookar-mobile-apk-build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: انتشار APK در GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: نیروکار — APK بیلد ${{ github.run_number }}
          body: |
            فایل نصبی اندروید (APK) اپلیکیشن نیروکار — بیلد ${{ github.run_number }}.

            **نصب:** فایل `nirookar-mobile-build-*.apk` را دانلود و روی دستگاه اندروید نصب کنید
            (برای نصب، اجازه «منابع ناشناس» را فعال کنید).
          files: dist/*.apk
          make_latest: true
