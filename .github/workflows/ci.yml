name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- وب‌سایت (Next.js) ----------
  web-quality:
    name: وب — بررسی کیفیت و ساخت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: بررسی TypeScript
        run: bunx tsc --noEmit

      - name: ساخت نسخه تولید
        run: bun run build

  # ---------- اپ موبایل (Expo / React Native) ----------
  mobile-quality:
    name: موبایل — بررسی TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        working-directory: apps/mobile
        run: npm install

      - name: بررسی TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit

  mobile-apk:
    name: موبایل — ساخت APK اندروید
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: نصب وابستگی‌ها
        working-directory: apps/mobile
        run: npm install

      - name: Prebuild اندروید
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install

      - name: ساخت APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: بارگذاری Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nirookar-mobile-apk-build-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
