name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- وب‌سایت (Next.js) ----------
  web-quality:
    name: وب — بررسی کیفیت و ساخت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها
        run: bun install --frozen-lockfile

      - name: تولید کلاینت Prisma
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: بررسی TypeScript
        run: bunx tsc --noEmit

      - name: ساخت نسخه تولید
        run: bun run build

  # ---------- اپ موبایل (Expo / React Native) ----------
  mobile-quality:
    name: موبایل — بررسی TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        working-directory: apps/mobile
        run: npm ci

      - name: بررسی TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit

  mobile-apk:
    name: موبایل — ساخت APK اندروید
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # قانون افزایش خودکار versionCode (بیلد 007+):
      # versionCode در apps/mobile/app.json مقدار مرجع است؛ اگر از آخرین
      # نسخه منتشرشده در Releases بزرگ‌تر یا مساوی بود، خودکار یکی بیشتر می‌شود
      # تا اندروید همیشه نسخه جدید را «به‌روزرسانی» روی نسخه قبلی نصب کند.
      - name: قانون افزایش خودکار versionCode
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body // ""' 2>/dev/null \
            | grep -oP 'versionCode:\s*\K[0-9]+' | tail -1 || true)
          LATEST=${LATEST:-0}
          CURRENT=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          if [ "$CURRENT" -le "$LATEST" ]; then
            NEW=$((LATEST + 1))
            node -e "
              const fs = require('fs');
              const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              j.expo.android.versionCode = $NEW;
              fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
            "
            echo "versionCode به‌صورت خودکار ارتقا یافت: $CURRENT → $NEW"
            echo "APK_VERSION_CODE=$NEW" >> "$GITHUB_ENV"
          else
            echo "versionCode: $CURRENT (بزرگ‌تر از آخرین انتشار: $LATEST) — بدون تغییر"
            echo "APK_VERSION_CODE=$CURRENT" >> "$GITHUB_ENV"
          fi

      - name: نصب وابستگی‌ها
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npm ci

      - name: Prebuild اندروید
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild -p android --no-install

      - name: ساخت APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # امضای ثابت (بیلد 007+): نمایش SHA-1/SHA-256 گواهی برای تأیید یکسانی امضا در همه بیلدها
      - name: تأیید امضای دیجیتال APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: آماده‌سازی فایل APK با نام خوانا
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             dist/nirookar-mobile-build-${{ github.run_number }}.apk
          ls -lh dist/

      - name: بارگذاری Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nirookar-mobile-apk-build-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: انتشار APK در GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: نیروکار — APK بیلد ${{ github.run_number }}
          body: |
            <!-- versionCode: ${{ env.APK_VERSION_CODE }} -->
            فایل نصبی اندروید (APK) اپلیکیشن نیروکار — بیلد ${{ github.run_number }}.
            نسخه 0.1.3 — versionCode: ${{ env.APK_VERSION_CODE }}

            **نصب:** فایل `nirookar-mobile-build-*.apk` را دانلود و روی دستگاه اندروید نصب کنید
            (برای نصب، اجازه «منابع ناشناس» را فعال کنید).

            **امضای ثابت (از بیلد 007):** همه APKها با یک گواهی واحد امضا می‌شوند؛ نسخه‌های جدید بدون حذف نسخه قبلی به‌صورت به‌روزرسانی نصب می‌شوند.
            ⚠️ اگر نسخه 006 یا قدیمی‌تر نصب دارید، یک بار باید آن را حذف و بیلد 007 را نصب کنید.
          files: dist/*.apk
          make_latest: true
