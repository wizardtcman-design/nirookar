name: Flutter CI & APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-apk.yml"
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    name: Build release APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (android, ios, web)
        run: |
          flutter create --platforms=android,ios,web --org ir.nirookar --project-name nirookar /tmp/platform_gen
          cp -r /tmp/platform_gen/android /tmp/platform_gen/ios /tmp/platform_gen/web flutter_app/

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK (product 1.0.0, build = run number)
        working-directory: flutter_app
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NirooKar-1.0.0-build-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APK to GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (android, ios, web)
        run: |
          flutter create --platforms=android,ios,web --org ir.nirookar --project-name nirookar /tmp/platform_gen
          cp -r /tmp/platform_gen/android /tmp/platform_gen/ios /tmp/platform_gen/web flutter_app/

      - name: Resolve APK version from tag
        run: echo "APK_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --build-name="$APK_VERSION" --build-number=${{ github.run_number }}

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
